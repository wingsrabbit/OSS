name: opensales-laboratory

x-core-env: &core-env
  OSS_ENV: ${OSS_ENV:-development}
  OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-http://localhost:8080}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  DATABASE_URL: postgresql://oss:${CORE_DATABASE_PASSWORD:?required}@core-db:5432/oss
  MOCK_PROVIDER_URL: http://provider:4000
  CORE_INTERNAL_URL: http://api:3000
  MOCK_PROVIDER_TOKEN: ${MOCK_PROVIDER_TOKEN:?required}
  MOCK_PROVIDER_WEBHOOK_SECRET: ${MOCK_PROVIDER_WEBHOOK_SECRET:?required}
  LAB_MAILBOX_ENABLED: ${LAB_MAILBOX_ENABLED:-true}

services:
  core-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: oss
      POSTGRES_USER: oss
      POSTGRES_PASSWORD: ${CORE_DATABASE_PASSWORD:?required}
    volumes:
      - core-db-data:/var/lib/postgresql
    networks: [core-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oss -d oss"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  provider-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: provider
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: ${PROVIDER_DATABASE_PASSWORD:?required}
    volumes:
      - provider-db-data:/var/lib/postgresql
    networks: [provider-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provider -d provider"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  seed:
    build:
      context: .
      target: runtime
    command:
      [
        "sh",
        "-c",
        "node apps/api/dist/migrate.js && node apps/api/dist/seed-termrat.js",
      ]
    environment: *core-env
    depends_on:
      core-db:
        condition: service_healthy
    networks: [core-data]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      target: runtime
    command: ["node", "apps/api/dist/server.js"]
    restart: unless-stopped
    environment: *core-env
    depends_on:
      seed:
        condition: service_completed_successfully
    networks: [core-data, core-app]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "apps/worker/dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *core-env
      MOCK_PROVISION_SCENARIO: ${MOCK_PROVISION_SCENARIO:-success}
    depends_on:
      api:
        condition: service_healthy
      provider:
        condition: service_healthy
    networks: [core-data, core-app, provider-app]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]

  provider:
    build:
      context: .
      target: runtime
    command: ["node", "providers/mock-lab/dist/server.js"]
    restart: unless-stopped
    environment:
      PROVIDER_DATABASE_URL: postgresql://provider:${PROVIDER_DATABASE_PASSWORD:?required}@provider-db:5432/provider
      MOCK_PROVIDER_TOKEN: ${MOCK_PROVIDER_TOKEN:?required}
      MOCK_PROVIDER_WEBHOOK_SECRET: ${MOCK_PROVIDER_WEBHOOK_SECRET:?required}
      CORE_CALLBACK_URL: http://api:3000
    depends_on:
      provider-db:
        condition: service_healthy
    networks: [provider-data, provider-app, core-app]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [core-app]
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0700
      - /data:size=16m,mode=0700
    security_opt: ["no-new-privileges:true"]

volumes:
  core-db-data:
  provider-db-data:

networks:
  core-data:
    internal: true
  provider-data:
    internal: true
  core-app:
  provider-app:
    internal: true
