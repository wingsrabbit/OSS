name: opensales-laboratory

x-core-env: &core-env
  OSS_ENV: ${OSS_ENV:-development}
  OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-http://localhost:8080}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
  MOCK_MAILBOX_URL: http://mailbox-gateway:8082
  LAB_MAILBOX_TOKEN: ${LAB_MAILBOX_TOKEN:?required}
  PROVIDER_OPERATION_CAPABILITY_SECRET: ${PROVIDER_OPERATION_CAPABILITY_SECRET:?required}
  PAYMENT_METHOD_TOKEN_KEY: ${PAYMENT_METHOD_TOKEN_KEY:?required}
  PAYMENT_METHOD_TOKEN_KEY_VERSION: ${PAYMENT_METHOD_TOKEN_KEY_VERSION:-1}
  PAYMENT_METHOD_TOKEN_PREVIOUS_KEYS: ${PAYMENT_METHOD_TOKEN_PREVIOUS_KEYS:-}
  PAYMENT_METHOD_TOKEN_LOOKUP_KEY: ${PAYMENT_METHOD_TOKEN_LOOKUP_KEY:?required}
  PAYMENT_METHOD_TOKEN_LOOKUP_KEY_VERSION: ${PAYMENT_METHOD_TOKEN_LOOKUP_KEY_VERSION:-1}
  PAYMENT_METHOD_TOKEN_LOOKUP_PREVIOUS_KEYS: ${PAYMENT_METHOD_TOKEN_LOOKUP_PREVIOUS_KEYS:-}
  OSS_SCHEMA_ROLLBACK_BRIDGE: ${OSS_SCHEMA_ROLLBACK_BRIDGE:-disabled}
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?required}
  MOCK_PROVISIONING_WEBHOOK_SECRET: ${MOCK_PROVISIONING_WEBHOOK_SECRET:?required}
  LAB_MAILBOX_ENABLED: ${LAB_MAILBOX_ENABLED:-true}

x-provider-base: &provider-base
  build:
    context: .
    target: runtime
  command: ["node", "providers/mock-lab/dist/server.js"]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
      ]
    interval: 10s
    timeout: 5s
    retries: 10

services:
  core-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: oss
      POSTGRES_USER: oss_migrator
      POSTGRES_PASSWORD: ${CORE_DATABASE_MIGRATOR_PASSWORD:?required}
    volumes:
      - core-db-data:/var/lib/postgresql
    networks: [core-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oss_migrator -d oss"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  provider-payment-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_provider
      POSTGRES_USER: payment_provider
      POSTGRES_PASSWORD: ${PAYMENT_PROVIDER_DATABASE_PASSWORD:?required}
    volumes:
      - provider-payment-db-data:/var/lib/postgresql
    networks: [payment-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_provider -d payment_provider"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  provider-provisioning-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: provisioning_provider
      POSTGRES_USER: provisioning_provider
      POSTGRES_PASSWORD: ${PROVISIONING_PROVIDER_DATABASE_PASSWORD:?required}
    volumes:
      - provider-provisioning-db-data:/var/lib/postgresql
    networks: [provisioning-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisioning_provider -d provisioning_provider"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  provider-mail-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mail_provider
      POSTGRES_USER: mail_provider
      POSTGRES_PASSWORD: ${MAIL_PROVIDER_DATABASE_PASSWORD:?required}
    volumes:
      - provider-mail-db-data:/var/lib/postgresql
    networks: [mail-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail_provider -d mail_provider"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  seed:
    build:
      context: .
      target: runtime
    command:
      [
        "sh",
        "-c",
        "node apps/api/dist/migrate.js && node apps/api/dist/seed-termrat.js",
      ]
    environment:
      <<: *core-env
      DATABASE_URL: postgresql://oss_api:${CORE_DATABASE_API_PASSWORD:?required}@core-db:5432/oss
      DATABASE_RUNTIME_ROLE: oss_api
      MIGRATION_DATABASE_URL: postgresql://oss_migrator:${CORE_DATABASE_MIGRATOR_PASSWORD:?required}@core-db:5432/oss
      DATABASE_API_ROLE_PASSWORD: ${CORE_DATABASE_API_PASSWORD:?required}
      DATABASE_WORKER_ROLE_PASSWORD: ${CORE_DATABASE_WORKER_PASSWORD:?required}
    depends_on:
      core-db:
        condition: service_healthy
    networks: [core-data]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      target: runtime
    command: ["node", "apps/api/dist/server.js"]
    restart: unless-stopped
    environment:
      <<: *core-env
      DATABASE_URL: postgresql://oss_api:${CORE_DATABASE_API_PASSWORD:?required}@core-db:5432/oss
      DATABASE_RUNTIME_ROLE: oss_api
    depends_on:
      seed:
        condition: service_completed_successfully
      provider-mailbox:
        condition: service_healthy
    networks: [core-data, core-app]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "apps/worker/dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *core-env
      DATABASE_URL: postgresql://oss_worker:${CORE_DATABASE_WORKER_PASSWORD:?required}@core-db:5432/oss
      DATABASE_RUNTIME_ROLE: oss_worker
      CORE_INTERNAL_URL: http://api:3000
      MOCK_PAYMENT_PROVIDER_URL: http://provider-payment:4000
      MOCK_PROVISIONING_PROVIDER_URL: http://provider-provisioning:4000
      MOCK_MAIL_PROVIDER_URL: http://provider-mail:4000
      MOCK_PAYMENT_PROVIDER_TOKEN: ${MOCK_PAYMENT_PROVIDER_TOKEN:?required}
      MOCK_PROVISIONING_PROVIDER_TOKEN: ${MOCK_PROVISIONING_PROVIDER_TOKEN:?required}
      MOCK_MAIL_PROVIDER_TOKEN: ${MOCK_MAIL_PROVIDER_TOKEN:?required}
      MOCK_PROVISION_SCENARIO: ${MOCK_PROVISION_SCENARIO:-success}
      MOCK_RESOURCE_ACTION_SCENARIO: ${MOCK_RESOURCE_ACTION_SCENARIO:-success}
    depends_on:
      api:
        condition: service_healthy
      provider-payment:
        condition: service_healthy
      provider-provisioning:
        condition: service_healthy
      provider-mail:
        condition: service_healthy
    networks: [core-data, core-app, payment-app, provisioning-app, mail-app]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]

  callback-gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile.callback:/etc/caddy/Caddyfile:ro
    networks: [core-app, payment-callback, provisioning-callback]
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0700
      - /data:size=16m,mode=0700
    security_opt: ["no-new-privileges:true"]

  mailbox-gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile.mailbox:/etc/caddy/Caddyfile:ro
    networks: [core-app, mailbox-app]
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0700
      - /data:size=16m,mode=0700
    security_opt: ["no-new-privileges:true"]

  provider-payment:
    <<: *provider-base
    environment:
      PROVIDER_DATABASE_URL: postgresql://payment_provider:${PAYMENT_PROVIDER_DATABASE_PASSWORD:?required}@provider-payment-db:5432/payment_provider
      MOCK_PAYMENT_PROVIDER_TOKEN: ${MOCK_PAYMENT_PROVIDER_TOKEN:?required}
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?required}
      CORE_CALLBACK_URL: http://callback-gateway:8081
    depends_on:
      provider-payment-db:
        condition: service_healthy
    networks: [payment-data, payment-app, payment-callback]

  provider-provisioning:
    <<: *provider-base
    environment:
      PROVIDER_DATABASE_URL: postgresql://provisioning_provider:${PROVISIONING_PROVIDER_DATABASE_PASSWORD:?required}@provider-provisioning-db:5432/provisioning_provider
      MOCK_PROVISIONING_PROVIDER_TOKEN: ${MOCK_PROVISIONING_PROVIDER_TOKEN:?required}
      MOCK_PROVISIONING_WEBHOOK_SECRET: ${MOCK_PROVISIONING_WEBHOOK_SECRET:?required}
      CORE_CALLBACK_URL: http://callback-gateway:8081
    depends_on:
      provider-provisioning-db:
        condition: service_healthy
    networks: [provisioning-data, provisioning-app, provisioning-callback]

  provider-mail:
    <<: *provider-base
    environment:
      PROVIDER_DATABASE_URL: postgresql://mail_provider:${MAIL_PROVIDER_DATABASE_PASSWORD:?required}@provider-mail-db:5432/mail_provider
      MOCK_MAIL_PROVIDER_TOKEN: ${MOCK_MAIL_PROVIDER_TOKEN:?required}
      CORE_CALLBACK_URL: http://127.0.0.1
    depends_on:
      provider-mail-db:
        condition: service_healthy
    networks: [mail-data, mail-app]

  provider-mailbox:
    <<: *provider-base
    environment:
      PROVIDER_DATABASE_URL: postgresql://mail_provider:${MAIL_PROVIDER_DATABASE_PASSWORD:?required}@provider-mail-db:5432/mail_provider
      LAB_MAILBOX_TOKEN: ${LAB_MAILBOX_TOKEN:?required}
      CORE_CALLBACK_URL: http://127.0.0.1
    depends_on:
      provider-mail-db:
        condition: service_healthy
    networks: [mail-data, mailbox-app]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [core-app]
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0700
      - /data:size=16m,mode=0700
    security_opt: ["no-new-privileges:true"]

volumes:
  core-db-data:
  provider-payment-db-data:
  provider-provisioning-db-data:
  provider-mail-db-data:

networks:
  core-data:
    internal: true
  payment-data:
    internal: true
  provisioning-data:
    internal: true
  mail-data:
    internal: true
  core-app:
    internal: true
  payment-app:
    internal: true
  provisioning-app:
    internal: true
  mail-app:
    internal: true
  mailbox-app:
    internal: true
  payment-callback:
    internal: true
  provisioning-callback:
    internal: true
