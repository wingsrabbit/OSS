name: Product CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-static:
    name: product-static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = '11.14.0'
          pnpm install --frozen-lockfile

      - name: Build shared Core declarations
        run: pnpm --filter @opensales/core build

      - name: Strict TypeScript
        run: pnpm -r --if-present typecheck

      - name: Production builds
        run: pnpm -r --if-present build

      - name: Domain tests
        run: pnpm -r --if-present test

  product-integration:
    name: product-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: oss
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oss"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oss
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oss
      DATABASE_API_ROLE_PASSWORD: ci-only-api-database-password-000000000000
      DATABASE_WORKER_ROLE_PASSWORD: ci-only-worker-database-password-000000000
      PROVIDER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/provider
      OSS_ENV: test
      OSS_PUBLIC_URL: http://127.0.0.1:5173
      WEB_ORIGIN: http://127.0.0.1:5173
      MOCK_PAYMENT_PROVIDER_URL: http://127.0.0.1:4000
      MOCK_PROVISIONING_PROVIDER_URL: http://127.0.0.1:4000
      MOCK_MAIL_PROVIDER_URL: http://127.0.0.1:4000
      MOCK_MAILBOX_URL: http://127.0.0.1:4000
      CORE_INTERNAL_URL: http://127.0.0.1:3000
      CORE_CALLBACK_URL: http://127.0.0.1:3000
      MOCK_PAYMENT_PROVIDER_TOKEN: ci-only-payment-token-00000000000000000
      MOCK_PROVISIONING_PROVIDER_TOKEN: ci-only-provision-token-000000000000000
      MOCK_MAIL_PROVIDER_TOKEN: ci-only-mail-token-00000000000000000000
      LAB_MAILBOX_TOKEN: ci-only-mailbox-token-000000000000000000
      PROVIDER_OPERATION_CAPABILITY_SECRET: ci-only-operation-capability-secret-000000
      PAYMENT_METHOD_TOKEN_KEY: FRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRU
      PAYMENT_METHOD_TOKEN_LOOKUP_KEY: FhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhY
      MOCK_PAYMENT_WEBHOOK_SECRET: ci-only-payment-webhook-secret-0000000000
      MOCK_PROVISIONING_WEBHOOK_SECRET: ci-only-provision-webhook-secret-0000000
      MOCK_PROVISION_SCENARIO: timeout_existing
      JOB_LOCK_TIMEOUT_SECONDS: "2"
      GLOBAL_RATE_LIMIT_MAX: "1000"
      LAB_MAILBOX_ENABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = '11.14.0'
          pnpm install --frozen-lockfile

      - name: Build applications and conformance code
        run: pnpm -r --if-present build

      - name: Create isolated Provider database
        shell: bash
        run: >-
          pnpm --filter @opensales/api exec node --input-type=module -e
          "import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.ADMIN_DATABASE_URL });
          await client.connect();
          await client.query('CREATE DATABASE provider');
          await client.end();"

      - name: Create isolated renewal lifecycle database
        shell: bash
        run: >-
          pnpm --filter @opensales/api exec node --input-type=module -e
          "import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.ADMIN_DATABASE_URL });
          await client.connect();
          await client.query('CREATE DATABASE renewal_lifecycle');
          await client.end();"

      - name: Create isolated critical financial test databases
        shell: bash
        run: >-
          pnpm --filter @opensales/api exec node --input-type=module -e
          "import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.ADMIN_DATABASE_URL });
          await client.connect();
          await client.query('CREATE DATABASE payment_token_rotation');
          await client.query('CREATE DATABASE manual_receipts');
          await client.query('CREATE DATABASE worker_job_claim');
          await client.query('CREATE DATABASE schema_rollback');
          await client.query('CREATE DATABASE schema_015_016_rollback');
          await client.query('CREATE DATABASE schema_016_017_rollback');
          await client.end();"

      - name: Run renewal lifecycle PostgreSQL journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/renewal_lifecycle
        run: pnpm --filter @opensales/api test:integration:renewal-lifecycle

      - name: Run payment token rotation PostgreSQL journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payment_token_rotation
        run: pnpm --filter @opensales/api test:integration:payment-method-token-rotation

      - name: Run manual receipt PostgreSQL journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/manual_receipts
        run: pnpm --filter @opensales/api test:integration:manual-receipts

      - name: Run schema 016 Worker job boundary PostgreSQL journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worker_job_claim
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worker_job_claim
        run: |
          pnpm --filter @opensales/api migrate
          pnpm --filter @opensales/worker test:integration:job-claim

      - name: Prepare schema 014 rollback database
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schema_rollback
        run: >-
          pnpm --filter @opensales/api exec node --input-type=module -e
          "import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())');
          const directory = join(process.env.GITHUB_WORKSPACE, 'apps/api/migrations');
          const migrations = (await readdir(directory))
            .filter((file) => /^(00[1-9]|01[0-4])_[a-z0-9_]+[.]sql$/.test(file))
            .sort();
          for (const file of migrations) {
            await client.query('BEGIN');
            try {
              await client.query(await readFile(join(directory, file), 'utf8'));
              await client.query('INSERT INTO schema_migrations(version) VALUES (\$1)', [file.replace(/[.]sql$/, '')]);
              await client.query('COMMIT');
            } catch (error) {
              await client.query('ROLLBACK');
              throw error;
            }
          }
          await client.end();"

      - name: Run schema rollback PostgreSQL journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schema_rollback
          OSS_SCHEMA_ROLLBACK_BRIDGE: "014-to-015"
        run: pnpm --filter @opensales/api test:integration:schema-rollback-preflight

      - name: Prepare schema 015 rollback bridge database
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schema_015_016_rollback
        run: >-
          pnpm --filter @opensales/api exec node --input-type=module -e
          "import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())');
          const directory = join(process.env.GITHUB_WORKSPACE, 'apps/api/migrations');
          const migrations = (await readdir(directory))
            .filter((file) => /^(00[1-9]|01[0-5])_[a-z0-9_]+[.]sql$/.test(file))
            .sort();
          for (const file of migrations) {
            await client.query('BEGIN');
            try {
              await client.query(await readFile(join(directory, file), 'utf8'));
              await client.query('INSERT INTO schema_migrations(version) VALUES (\$1)', [file.replace(/[.]sql$/, '')]);
              await client.query('COMMIT');
            } catch (error) {
              await client.query('ROLLBACK');
              throw error;
            }
          }
          await client.end();"

      - name: Run schema 015 to 016 rollback bridge PostgreSQL journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schema_015_016_rollback
        run: pnpm --filter @opensales/api test:integration:schema-015-016-rollback-preflight

      - name: Prepare schema 016 rollback bridge database
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schema_016_017_rollback
        run: >-
          pnpm --filter @opensales/api exec node --input-type=module -e
          "import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query('CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())');
          const directory = join(process.env.GITHUB_WORKSPACE, 'apps/api/migrations');
          const migrations = (await readdir(directory))
            .filter((file) => /^(00[1-9]|01[0-6])_[a-z0-9_]+[.]sql$/.test(file))
            .sort();
          for (const file of migrations) {
            await client.query('BEGIN');
            try {
              await client.query(await readFile(join(directory, file), 'utf8'));
              await client.query('INSERT INTO schema_migrations(version) VALUES (\$1)', [file.replace(/[.]sql$/, '')]);
              await client.query('COMMIT');
            } catch (error) {
              await client.query('ROLLBACK');
              throw error;
            }
          }
          await client.end();"

      - name: Run schema 016 to 017 rollback bridge PostgreSQL journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schema_016_017_rollback
        run: pnpm --filter @opensales/api test:integration:schema-016-017-rollback-preflight

      - name: Apply forward migrations and synthetic configuration
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @opensales/api migrate
          DATABASE_URL=postgresql://oss_api:${DATABASE_API_ROLE_PASSWORD}@127.0.0.1:5432/oss \
            pnpm --filter @opensales/api seed:termrat

      - name: Prove migration and runtime database role separation
        run: pnpm --filter @opensales/api test:integration:database-role-boundary

      - name: Start API, Worker, and Mock Provider
        shell: bash
        run: |
          set -euo pipefail
          node providers/mock-lab/dist/server.js > provider.log 2>&1 &
          DATABASE_URL=postgresql://oss_api:${DATABASE_API_ROLE_PASSWORD}@127.0.0.1:5432/oss \
            DATABASE_RUNTIME_ROLE=oss_api node apps/api/dist/server.js > api.log 2>&1 &
          echo "$!" > api.pid
          DATABASE_URL=postgresql://oss_worker:${DATABASE_WORKER_ROLE_PASSWORD}@127.0.0.1:5432/oss \
            DATABASE_RUNTIME_ROLE=oss_worker MOCK_RESOURCE_ACTION_SCENARIO=timeout_success \
            node apps/worker/dist/worker.js > worker.log 2>&1 &
          echo "$!" > worker.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null &&
               curl --fail --silent http://127.0.0.1:4000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 100 api.log provider.log worker.log
          exit 1

      - name: Run PostgreSQL Stage A journey
        env:
          EXPECT_RESOURCE_ACTION_SCENARIO: timeout_success
        run: pnpm --filter @opensales/api test:integration:stage-a

      - name: Restart Worker for isolated browser journey
        shell: bash
        run: |
          set -euo pipefail
          read -r worker_pid < worker.pid
          kill "${worker_pid}"
          for attempt in $(seq 1 30); do
            if ! kill -0 "${worker_pid}" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          if kill -0 "${worker_pid}" 2>/dev/null; then
            echo "Worker process did not stop cleanly"
            exit 1
          fi
          DATABASE_URL=postgresql://oss_worker:${DATABASE_WORKER_ROLE_PASSWORD}@127.0.0.1:5432/oss \
            DATABASE_RUNTIME_ROLE=oss_worker node apps/worker/dist/worker.js \
            > worker-browser.log 2>&1 &
          echo "$!" > worker.pid

      - name: Install pinned Chromium runtime
        run: pnpm --filter @opensales/e2e exec playwright install --with-deps chromium

      - name: Restart API for isolated browser journey
        shell: bash
        env:
          OSS_LOG_LEVEL: error
        run: |
          set -euo pipefail
          read -r api_pid < api.pid
          kill "${api_pid}"
          for attempt in $(seq 1 30); do
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          if kill -0 "${api_pid}" 2>/dev/null; then
            echo "API process did not stop cleanly"
            exit 1
          fi
          DATABASE_URL=postgresql://oss_api:${DATABASE_API_ROLE_PASSWORD}@127.0.0.1:5432/oss \
            DATABASE_RUNTIME_ROLE=oss_api node apps/api/dist/server.js \
            > api-browser.log 2>&1 &
          echo "$!" > api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 100 api-browser.log
          exit 1

      - name: Start customer web application
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @opensales/web dev > web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 100 web.log
          exit 1

      - name: Run browser Stage A journey
        shell: bash
        run: |
          set +e
          pnpm --filter @opensales/e2e test:e2e
          browser_status=$?
          set -e
          if [[ "${browser_status}" -ne 0 ]]; then
            echo "Browser journey failed; redacted API errors follow"
            # This filter is intentionally limited to synthetic CI diagnostics;
            # production logging must use an independently reviewed policy.
            grep '"msg":"request failed"' api-browser.log > request-failures.log || true
            if ! sed -E \
              -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[UUID]/g' \
              -e 's/[A-Za-z0-9._%+-]+@example[.]invalid/[SYNTHETIC_EMAIL]/g' \
              -e 's/ci-only-[A-Za-z0-9_-]+/[CI_SECRET]/g' \
              -e 's/[A-Za-z0-9_-]{43}/[KEY_MATERIAL]/g' \
              request-failures.log | tail -n 50; then
              echo "Redacted API diagnostics were unavailable"
            fi
          fi
          exit "${browser_status}"
