name: Bootstrap Policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-policy:
    name: bootstrap-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Activate pinned package manager
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.18.0'
          test "$(corepack --version)" = '0.35.0'
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = '11.14.0'

      - name: Install validator dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate bootstrap policy
        shell: bash
        run: |
          set -euo pipefail
          banner='NOT FOR PRODUCTION — MOCK PROVIDERS ONLY'
          grep -Fq "$banner" README.md
          grep -Fq "$banner" LAB_LIMITATIONS.md

          forbidden_names='(^|/)(id_rsa|id_ed25519)(\.|$)|\.(pem|key|p12|pfx)$|(^|/)\.env(\..+)?$'
          forbidden_tracked=$(git ls-files | grep -E "$forbidden_names" | grep -Ev '(^|/)\.env\.example$' || true)
          if [[ -n "$forbidden_tracked" ]]; then
            printf 'Forbidden secret-bearing filename is tracked:\n%s\n' "$forbidden_tracked" >&2
            exit 1
          fi

          while IFS= read -r json_file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$json_file"
          done < <(git ls-files '*.json')

      - name: Run specification policy tests
        shell: bash
        run: node --test tools/validate-specifications.test.mjs

      - name: Validate specification documents
        shell: bash
        run: node tools/validate-specifications.mjs

      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1
